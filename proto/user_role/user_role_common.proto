syntax = "proto3";

package pb.user_role;

option go_package = "github.com/MamangRust/microservice-ecommerce-grpc-pb/user_role;pb_user_role";

message UserRoleResponse {
    int32 user_role_id = 1;
    int32 user_id = 2;
    int32 role_id = 3;
    string created_at = 4;
    string updated_at = 5;
}

message ApiResponseUserRole {
    string status = 1;
    string message = 2;
    UserRoleResponse data = 3;
}

message AssignRoleToUserRequest {
    int32 user_id = 1;
    int32 role_id = 2;
}

message RemoveRoleFromUserRequest {
    int32 user_id = 1;
    int32 role_id = 2;
}

message FindByIdUserRoleRequest {
    int32 user_id = 1;
}
